# Pruebas rápidas en cada envío (sin las reconstrucciones 3D largas), con Qt sin pantalla.
name: pruebas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requisitos.txt
      - name: Librerías del sistema para Qt y OpenGL
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Instalar requisitos
        run: pip install -r requisitos.txt
      - name: Pruebas rápidas
        env:
          QT_QPA_PLATFORM: offscreen
          NUBE2STL_NO_SPLASH: '1'
          NUBE2STL_NO_UPDATE: '1'
        run: python pruebas.py rapidas
